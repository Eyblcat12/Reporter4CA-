<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Reporter Pro large workload benchmark</title>
  <desc id="desc">Elapsed time and peak memory for successful DOCX generation from one thousand to three thousand seven hundred fifty assets, plus guarded stops at four and five thousand assets.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a65ff"/>
      <stop offset="1" stop-color="#5c3fd6"/>
    </linearGradient>
    <linearGradient id="mem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36d6a0"/>
      <stop offset="1" stop-color="#178c70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#0b0b12"/>
  <text x="48" y="48" fill="#f5f2ff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Benchmark DOCX chi tiết · input 50.000 máy</text>
  <text x="48" y="75" fill="#9d98b2" font-family="Segoe UI,Arial,sans-serif" font-size="14">Một file DOCX · template bắt buộc · watchdog RAM 3 GB · thời gian càng thấp càng tốt</text>

  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="52" y="126" fill="#dcd7ed" font-size="15" font-weight="700">Tổng thời gian (giây)</text>
    <line x1="76" y1="320" x2="702" y2="320" stroke="#393449"/>
    <line x1="76" y1="270" x2="702" y2="270" stroke="#242131"/>
    <line x1="76" y1="220" x2="702" y2="220" stroke="#242131"/>
    <line x1="76" y1="170" x2="702" y2="170" stroke="#242131"/>
    <text x="64" y="325" text-anchor="end" fill="#77718c" font-size="11">0</text>
    <text x="64" y="275" text-anchor="end" fill="#77718c" font-size="11">150</text>
    <text x="64" y="225" text-anchor="end" fill="#77718c" font-size="11">300</text>
    <text x="64" y="175" text-anchor="end" fill="#77718c" font-size="11">450</text>
    <rect x="102" y="289" width="72" height="31" rx="7" fill="url(#bar)"/><text x="138" y="282" text-anchor="middle" fill="#cfc8e9" font-size="11">93,8</text>
    <rect x="218" y="257" width="72" height="63" rx="7" fill="url(#bar)"/><text x="254" y="250" text-anchor="middle" fill="#cfc8e9" font-size="11">188,2</text>
    <rect x="334" y="195" width="72" height="125" rx="7" fill="url(#bar)"/><text x="370" y="188" text-anchor="middle" fill="#cfc8e9" font-size="11">375,2</text>
    <rect x="450" y="180" width="72" height="140" rx="7" fill="url(#bar)"/><text x="486" y="173" text-anchor="middle" fill="#cfc8e9" font-size="11">419,4</text>
    <rect x="566" y="182" width="72" height="138" rx="7" fill="url(#bar)"/><text x="602" y="175" text-anchor="middle" fill="#cfc8e9" font-size="11">414,1</text>
    <text x="138" y="344" text-anchor="middle" fill="#9d98b2" font-size="11">1.000</text>
    <text x="254" y="344" text-anchor="middle" fill="#9d98b2" font-size="11">2.000</text>
    <text x="370" y="344" text-anchor="middle" fill="#9d98b2" font-size="11">3.000</text>
    <text x="486" y="344" text-anchor="middle" fill="#9d98b2" font-size="11">3.500</text>
    <text x="602" y="344" text-anchor="middle" fill="#9d98b2" font-size="11">3.750</text>

    <text x="748" y="126" fill="#dcd7ed" font-size="15" font-weight="700">Peak RSS (MB)</text>
    <line x1="764" y1="320" x2="1148" y2="320" stroke="#393449"/>
    <line x1="764" y1="270" x2="1148" y2="270" stroke="#242131"/>
    <line x1="764" y1="220" x2="1148" y2="220" stroke="#242131"/>
    <line x1="764" y1="170" x2="1148" y2="170" stroke="#242131"/>
    <rect x="788" y="278" width="48" height="42" rx="6" fill="url(#mem)"/><text x="812" y="271" text-anchor="middle" fill="#bdebdc" font-size="10">848</text>
    <rect x="860" y="241" width="48" height="79" rx="6" fill="url(#mem)"/><text x="884" y="234" text-anchor="middle" fill="#bdebdc" font-size="10">1.576</text>
    <rect x="932" y="198" width="48" height="122" rx="6" fill="url(#mem)"/><text x="956" y="191" text-anchor="middle" fill="#bdebdc" font-size="10">2.433</text>
    <rect x="1004" y="187" width="48" height="133" rx="6" fill="url(#mem)"/><text x="1028" y="180" text-anchor="middle" fill="#bdebdc" font-size="10">2.661</text>
    <rect x="1076" y="174" width="48" height="146" rx="6" fill="url(#mem)"/><text x="1100" y="167" text-anchor="middle" fill="#bdebdc" font-size="10">2.928</text>
    <text x="812" y="344" text-anchor="middle" fill="#9d98b2" font-size="10">1k</text>
    <text x="884" y="344" text-anchor="middle" fill="#9d98b2" font-size="10">2k</text>
    <text x="956" y="344" text-anchor="middle" fill="#9d98b2" font-size="10">3k</text>
    <text x="1028" y="344" text-anchor="middle" fill="#9d98b2" font-size="10">3,5k</text>
    <text x="1100" y="344" text-anchor="middle" fill="#9d98b2" font-size="10">3,75k</text>

    <rect x="48" y="386" width="340" height="90" rx="14" fill="#15131f" stroke="#302b42"/>
    <circle cx="76" cy="418" r="7" fill="#36d6a0"/>
    <text x="94" y="423" fill="#f5f2ff" font-size="14" font-weight="700">3.750 máy: hoàn tất</text>
    <text x="76" y="451" fill="#9d98b2" font-size="12">DOCX hợp lệ · 4,30 MiB · 3.753 bảng</text>

    <rect x="412" y="386" width="340" height="90" rx="14" fill="#15131f" stroke="#4d3827"/>
    <circle cx="440" cy="418" r="7" fill="#ffb454"/>
    <text x="458" y="423" fill="#f5f2ff" font-size="14" font-weight="700">4.000–5.000 máy: dừng bảo vệ</text>
    <text x="440" y="451" fill="#9d98b2" font-size="12">Vượt watchdog 3 GB, không làm treo ứng dụng</text>

    <rect x="776" y="386" width="376" height="90" rx="14" fill="#15131f" stroke="#302b42"/>
    <circle cx="804" cy="418" r="7" fill="#8a65ff"/>
    <text x="822" y="423" fill="#f5f2ff" font-size="14" font-weight="700">Soak 120 phút: đạt</text>
    <text x="804" y="451" fill="#9d98b2" font-size="12">83 job · 0 lỗi ngoài dự kiến · RSS tăng 18,4 MB</text>
  </g>
</svg>
