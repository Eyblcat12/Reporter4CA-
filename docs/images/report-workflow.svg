<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Reporter Pro workflow</title>
  <desc id="desc">Six-step flow from tracking data to a generated DOCX report.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171525"/>
      <stop offset="1" stop-color="#11111a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ef4f8f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="250" rx="24" fill="#0b0b12"/>
  <text x="48" y="42" fill="#f4f1ff" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Luồng tạo báo cáo</text>
  <text x="1152" y="42" text-anchor="end" fill="#8f8aa8" font-family="Segoe UI,Arial,sans-serif" font-size="13">Local-first · có kiểm tra trước khi xuất</text>

  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(48 76)">
      <rect width="156" height="122" rx="16" fill="url(#panel)" stroke="#2f2b43"/>
      <circle cx="28" cy="28" r="15" fill="#7c5cff"/><text x="28" y="33" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text>
      <text x="20" y="66" fill="#f4f1ff" font-size="15" font-weight="700">Nhập dữ liệu</text>
      <text x="20" y="89" fill="#9d98b2" font-size="12">File · Raw text · Mẫu</text>
    </g>
    <path d="M212 137h24" stroke="#6f678d" stroke-width="2"/><path d="m232 131 8 6-8 6" fill="none" stroke="#6f678d" stroke-width="2"/>
    <g transform="translate(248 76)">
      <rect width="156" height="122" rx="16" fill="url(#panel)" stroke="#2f2b43"/>
      <circle cx="28" cy="28" r="15" fill="#8665ff"/><text x="28" y="33" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text>
      <text x="20" y="66" fill="#f4f1ff" font-size="15" font-weight="700">Mapping cột</text>
      <text x="20" y="89" fill="#9d98b2" font-size="12">Chuẩn hóa tracking</text>
    </g>
    <path d="M412 137h24" stroke="#6f678d" stroke-width="2"/><path d="m432 131 8 6-8 6" fill="none" stroke="#6f678d" stroke-width="2"/>
    <g transform="translate(448 76)">
      <rect width="156" height="122" rx="16" fill="url(#panel)" stroke="#2f2b43"/>
      <circle cx="28" cy="28" r="15" fill="#9365ef"/><text x="28" y="33" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">3</text>
      <text x="20" y="66" fill="#f4f1ff" font-size="15" font-weight="700">Kiểm tra dữ liệu</text>
      <text x="20" y="89" fill="#9d98b2" font-size="12">Lỗi · cảnh báo · rule</text>
    </g>
    <path d="M612 137h24" stroke="#6f678d" stroke-width="2"/><path d="m632 131 8 6-8 6" fill="none" stroke="#6f678d" stroke-width="2"/>
    <g transform="translate(648 76)">
      <rect width="156" height="122" rx="16" fill="url(#panel)" stroke="#2f2b43"/>
      <circle cx="28" cy="28" r="15" fill="#ad5fc6"/><text x="28" y="33" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">4</text>
      <text x="20" y="66" fill="#f4f1ff" font-size="15" font-weight="700">Cấu hình</text>
      <text x="20" y="89" fill="#9d98b2" font-size="12">Loại report · template</text>
    </g>
    <path d="M812 137h24" stroke="#6f678d" stroke-width="2"/><path d="m832 131 8 6-8 6" fill="none" stroke="#6f678d" stroke-width="2"/>
    <g transform="translate(848 76)">
      <rect width="156" height="122" rx="16" fill="url(#panel)" stroke="#2f2b43"/>
      <circle cx="28" cy="28" r="15" fill="#cf579f"/><text x="28" y="33" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">5</text>
      <text x="20" y="66" fill="#f4f1ff" font-size="15" font-weight="700">Preview &amp; job</text>
      <text x="20" y="89" fill="#9d98b2" font-size="12">Tiến độ · hủy an toàn</text>
    </g>
    <path d="M1012 137h24" stroke="#6f678d" stroke-width="2"/><path d="m1032 131 8 6-8 6" fill="none" stroke="#6f678d" stroke-width="2"/>
    <g transform="translate(1048 76)">
      <rect width="104" height="122" rx="16" fill="url(#accent)"/>
      <circle cx="28" cy="28" r="15" fill="#fff" fill-opacity=".2"/><text x="28" y="33" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">6</text>
      <text x="18" y="66" fill="#fff" font-size="15" font-weight="700">DOCX</text>
      <text x="18" y="89" fill="#fff" fill-opacity=".82" font-size="12">Tải kết quả</text>
    </g>
  </g>
</svg>
